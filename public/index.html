<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Cross-platform weather app built with React Native, Expo and TypeScript." />
    <title>%WEB_TITLE%</title>

    <!--
      This is a mobile-first app. On the web we keep it inside a phone-sized
      frame so the layout looks intentional on tablets and desktops.
    -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background-color: #0b1120;
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 55%, #060a13 100%);
      }

      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        background-color: #0f172a;
      }

      @media (min-width: 600px) {
        body {
          padding: 28px 0;
          box-sizing: border-box;
        }

        #root {
          border-radius: 28px;
          box-shadow:
            0 24px 80px rgba(0, 0, 0, 0.65),
            0 0 0 1px rgba(255, 255, 255, 0.08);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
