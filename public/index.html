<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Cross-platform weather app built with React Native, Expo and TypeScript." />
    <title>%WEB_TITLE%</title>

    <!--
      This is a mobile-first app. On the web we render it on a fixed 390x844
      phone canvas and scale it as a whole, so the layout always keeps the
      proportions it has on a real device. Following the browser height (the
      previous behaviour) clipped the home screen on short windows.
    -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #0b1120;
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 55%, #060a13 100%);
      }

      #root {
        display: flex;
        width: 390px;
        height: 844px;
        flex: none;
        overflow: hidden;
        background-color: #0f172a;
        border-radius: 28px;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        transform-origin: center center;
      }

      /*
        The weather icons drift only 20px over 15-30s. Without a compositor
        layer the browser snaps that sub-pixel movement to whole pixels, which
        looks like it moves frame by frame. This keeps it smooth and does not
        change the animation itself.
      */
      [data-weather-slide='true'] {
        will-change: transform;
        backface-visibility: hidden;
      }

      @media (max-width: 599px) {
        #root {
          width: 100%;
          height: 100%;
          border-radius: 0;
          box-shadow: none;
          transform: none !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        const DESIGN_WIDTH = 390;
        const DESIGN_HEIGHT = 844;
        const MAX_WIDTH = 480;
        const MARGIN = 28;
        const MOBILE_QUERY = '(max-width: 599px)';

        const root = document.getElementById('root');

        const fitPhoneFrame = () => {
          if (window.matchMedia(MOBILE_QUERY).matches) {
            root.style.transform = '';
            return;
          }

          const scale = Math.min(
            MAX_WIDTH / DESIGN_WIDTH,
            Math.max((window.innerHeight - MARGIN * 2) / DESIGN_HEIGHT, 0.2)
          );

          root.style.transform = `scale(${scale})`;
        };

        fitPhoneFrame();
        window.addEventListener('resize', fitPhoneFrame);
      })();
    </script>
  </body>
</html>
